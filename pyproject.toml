[project]
name = "ecl-plugin-onlinegame"
version = "1.0.0-beta"
description = "EuoraCraft Launcher 联机插件：建房、加入、玩家管理、NAT 检测与节点设置"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff==0.16.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4
exclude = [
    "onlinegame/florolding",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "C90", # mccabe complexity
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N818",   # Exception name should end with Error
    "N999",   # Invalid module name (ECL is project-specific)
    "RUF001", # Ambiguous unicode char in strings (false positives in Chinese)
    "RUF002", # Ambiguous unicode char in docstrings (false positives in Chinese)
    "RUF003", # Ambiguous unicode char in comments (false positives in Chinese)
    "RUF012", # Mutable class attributes should use typing.ClassVar
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["onlinegame"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
